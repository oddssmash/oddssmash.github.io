name: Refresh data and publish

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes, so finished MLBB (and NBA/FIBA) results are learned quickly; a run takes about 9 minutes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # a running build always finishes; the newest push or schedule builds right after it

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep the downloaded history between runs so only new games are fetched.
      # The copy committed in the repository is the starting point the first time.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: nba-data-${{ github.run_id }}
          restore-keys: nba-data-

      - name: Fetch fresh data
        run: node scripts/fetch.mjs

      - name: Data checks
        run: node scripts/checks.mjs --quiet

      - name: Replay history and build projections
        run: node scripts/model.mjs

      - name: Simulate upcoming games
        run: node scripts/simulate.mjs

      # Picks track record: freeze each pick at the last run before its game, grade it after the final.
      - name: Picks track record
        continue-on-error: true
        run: node scripts/picks-ledger.mjs

      - name: Insights and live snapshot
        run: |
          node scripts/insights.mjs
          node scripts/live.mjs

      # FIBA section: schedules, box scores, shot locations and the latest posted rosters (next 21 days) from fiba.basketball,
      # then the walk-forward model, then headlines (Google News, Reddit, FIBA YouTube) tagged to teams and players.
      # A FIBA hiccup must not stop the NBA update, so these steps may fail without failing the run.
      - name: FIBA fetch and model
        continue-on-error: true
        run: |
          node scripts/fiba/fetch.mjs
          node scripts/fiba/model.mjs
          node scripts/fiba/picks-ledger.mjs
          node scripts/fiba/news.mjs

      # MLBB section: matches, drafts and season lineups from Liquipedia (API, one request every 2 seconds, only
      # changed pages), official stats from the MPL PH and MPL ID sites, then the walk-forward model.
      - name: MLBB fetch and model
        continue-on-error: true
        run: |
          node scripts/mlbb/fetch.mjs
          node scripts/mlbb/teamnames.mjs
          node scripts/mlbb/ranked.mjs
          node scripts/mlbb/model.mjs
          node scripts/mlbb/images.mjs

      # One site: homepage at the root, NBA under /nba/, FIBA under /fiba/. The version tag makes phones
      # load the new code right after a deploy.
      - name: Assemble the site
        run: |
          v="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          node scripts/site.mjs "$v"
          grep -o 'app.js?v=[^"]*' site/nba/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
