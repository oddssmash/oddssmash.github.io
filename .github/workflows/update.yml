name: Refresh data and publish

on:
  # The refresh runs on a chain: each run ends by starting the refresh timer (timer.yml) with the wait planned by
  # scripts/next-run.mjs (about every 20 minutes while games are on, 30 on match days, 60 otherwise). GitHub starts cron
  # runs only a few times a day here, so the cron below is only a backup that restarts the chain if it ever breaks.
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # a running build always finishes; the newest push or schedule builds right after it

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      wait: ${{ steps.plan.outputs.wait }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep the downloaded history between runs so only new games are fetched.
      # The copy committed in the repository is the starting point the first time.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: nba-data-${{ github.run_id }}
          restore-keys: nba-data-

      - name: Fetch fresh data
        run: node scripts/fetch.mjs

      - name: Data checks
        run: node scripts/checks.mjs --quiet

      - name: Replay history and build projections
        run: node scripts/model.mjs

      - name: Simulate upcoming games
        run: node scripts/simulate.mjs

      # Picks track record: freeze each pick at the last run before its game, grade it after the final.
      - name: Picks track record
        continue-on-error: true
        run: node scripts/picks-ledger.mjs

      - name: Insights and live snapshot
        run: |
          node scripts/insights.mjs
          node scripts/hitrates.mjs || echo "hit rates skipped"
          node scripts/live.mjs

      # FIBA section: schedules, box scores, shot locations and the latest posted rosters (next 21 days) from fiba.basketball,
      # then the walk-forward model, then headlines (Google News, Reddit, FIBA YouTube) tagged to teams and players.
      # A FIBA hiccup must not stop the NBA update, so these steps may fail without failing the run.
      # Downloads and models are separate steps: a slow source can no longer stop the model from publishing that sport.
      - name: FIBA fetch
        continue-on-error: true
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --import ./scripts/lib/fetch-timeout.mjs
        run: node scripts/fiba/fetch.mjs
      - name: FIBA model
        continue-on-error: true
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --import ./scripts/lib/fetch-timeout.mjs
        run: |
          node scripts/fiba/model.mjs
          node scripts/fiba/picks-ledger.mjs
          node scripts/fiba/news.mjs

      # MLBB section: matches, drafts and season lineups from Liquipedia (API, one request every 2 seconds, only
      # changed pages), official stats from the MPL PH and MPL ID sites, then the walk-forward model.
      - name: MLBB fetch
        continue-on-error: true
        timeout-minutes: 20
        env:
          NODE_OPTIONS: --import ./scripts/lib/fetch-timeout.mjs
        run: |
          node scripts/mlbb/fetch.mjs
          node scripts/mlbb/teamnames.mjs
          node scripts/mlbb/ranked.mjs
      - name: MLBB model
        continue-on-error: true
        timeout-minutes: 20
        env:
          NODE_OPTIONS: --import ./scripts/lib/fetch-timeout.mjs
        run: |
          node scripts/mlbb/model.mjs
          node scripts/mlbb/images.mjs

      # Dota 2 section: pro matches with drafts and player lines from OpenDota (open API and SQL explorer), the schedule
      # from Liquipedia (one page render), Valve patch notes, then the walk-forward model and headlines (Google News, Reddit,
      # YouTube, Steam news), lineups for every scheduled team from Liquipedia (tournament participant lists and team pages,
      # batched query requests, cached 6 to 24 hours). Like MLBB and FIBA, a hiccup here must not stop the rest of the site.
      - name: Dota 2 fetch
        continue-on-error: true
        timeout-minutes: 15
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          NODE_OPTIONS: --import ./scripts/lib/fetch-timeout.mjs
        run: |
          node scripts/dota2/fetch.mjs
          node scripts/dota2/rosters.mjs
          node scripts/dota2/odds.mjs
          node scripts/dota2/live.mjs
      - name: Dota 2 model
        continue-on-error: true
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --import ./scripts/lib/fetch-timeout.mjs
        run: |
          node scripts/dota2/model.mjs
          node scripts/dota2/news.mjs

      # One site: homepage at the root, NBA under /nba/, FIBA under /fiba/. The version tag makes phones
      # load the new code right after a deploy.
      # Safety net: the last published site is restored first, so a sport whose model did not finish this run keeps its last
      # published data instead of going blank.
      - name: Restore the last published site
        uses: actions/cache/restore@v4
        with:
          path: site
          key: site-none
          restore-keys: site-
      - name: Assemble the site
        run: |
          v="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          if [ -d site ]; then mv site prev-site; fi
          node scripts/site.mjs "$v"
          for app in nba fiba mlbb dota2; do
            if [ ! -f "site/$app/data/meta.json" ] && [ -f "prev-site/$app/data/meta.json" ]; then rm -rf "site/$app/data"; cp -r "prev-site/$app/data" "site/$app/data"; echo "::warning::$app model did not publish this run: kept its last published data"; fi
          done
          rm -rf prev-site
          grep -o 'app.js?v=[^"]*' site/nba/index.html
          node scripts/winrate.mjs || echo "win rate skipped"

      - name: Plan the next refresh
        id: plan
        run: node scripts/next-run.mjs

      # The assembled site is cached so the quick deploy workflow can publish code changes on top of it in minutes.
      - name: Cache the assembled site
        uses: actions/cache/save@v4
        with:
          path: site
          key: site-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Start the refresh timer, which waits the planned minutes and then starts the next run (see timer.yml). It runs even when
  # this run failed, so one bad run does not stop the refreshes.
  timer:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the refresh timer
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT: ${{ needs.build.outputs.wait || '30' }}
        run: |
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/timer.yml/dispatches" -d "{\"ref\":\"main\",\"inputs\":{\"wait\":\"$WAIT\"}}")
          echo "timer started (wait $WAIT min): HTTP $code"; [ "$code" = 204 ] || { cat /tmp/r.txt; exit 1; }
