name: Refresh timer

# GitHub starts cron runs only a few times a day for this repository, so the refresh runs on a chain instead: every
# "Refresh data and publish" run ends by starting this timer with the wait it planned (scripts/next-run.mjs: about 10
# minutes while games are on, 20 on match days, 50 when nothing is scheduled). While it waits, the timer refreshes FIBA live
# scores every 5 minutes when a FIBA game is on (one page per event; nothing is read when no game is in the window). Then it
# starts the next refresh, unless one is already queued or running (a push starts one too). A newer timer replaces an older
# one, so only one chain runs. If the chain ever breaks, the cron backup in update.yml starts it again.
on:
  workflow_dispatch:
    inputs:
      wait:
        description: "Minutes to wait before the next full refresh"
        required: false
        default: "30"

permissions:
  contents: write # FIBA live scores on the live-data branch
  actions: write # start the next refresh

concurrency:
  group: refresh-timer
  cancel-in-progress: true

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait, with FIBA live scores while games are on
        env:
          WAIT: ${{ inputs.wait }}
        run: |
          w="${WAIT:-30}"; case "$w" in ''|*[!0-9]*) w=30;; esac; [ "$w" -gt 60 ] && w=60; [ "$w" -lt 3 ] && w=3
          end=$(( $(date +%s) + w * 60 )); had=0
          echo "Next full refresh in $w minutes"
          while :; do
            if node scripts/fiba/live.mjs | tee /tmp/fl.txt | grep -q "no game in the window"; then games=0; else games=1; fi
            if [ "$games" = 1 ] || [ "$had" = 1 ]; then
              rm -rf /tmp/live && mkdir -p /tmp/live && cp live/*.json /tmp/live/ && (
                cd /tmp/live && git init -q -b live-data && git config user.name "ODDSSMASH" && git config user.email "cbdpccapps@users.noreply.github.com" &&
                git add -A && git commit -q -m "live scores $(date -u +%FT%TZ)" &&
                git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data ) || echo "live publish failed"
            fi
            had=$games
            left=$(( end - $(date +%s) )); [ "$left" -le 0 ] && break
            s=300; [ "$left" -lt "$s" ] && s=$left; sleep "$s"
          done
      - name: Start the next full refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/actions"
          busy=0
          for st in queued in_progress waiting pending; do
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$api/workflows/update.yml/runs?status=$st&per_page=1" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).total_count||0)}catch{console.log(0)}})')
            [ "$n" -gt 0 ] && busy=1
          done
          if [ "$busy" = 1 ]; then echo "A refresh is already queued or running; it starts the next timer."; exit 0; fi
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$api/workflows/update.yml/dispatches" -d '{"ref":"main"}')
          echo "dispatch HTTP $code"; [ "$code" = 204 ] || { cat /tmp/r.txt; exit 1; }
